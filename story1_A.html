<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストーリー① - A（先輩）</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="game.css">

  <!-- 共通JS -->
  <script src="game.js"></script>
</head>
<body>

  <h1>ストーリー①（A：クールな先輩）</h1>

<div class="story-container">

  <p>
    先輩は静かにあなたを見つめた。  
    「……新入生か。迷ってるなら案内してやる」  
    その声は冷たいようで、どこか優しさが滲んでいた。
  </p>

  <div class="line">
    <img class="icon" src="img/icon_fujimaru.png" alt="">
    <div class="bubble">「……新入生か。迷ってるなら案内してやる」</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="">
    <div class="bubble">「お願いします」</div>
  </div>

  <img class="still" src="img/still001.png" alt="">

  <div class="line">
    <img class="icon" src="img/test.png" alt="">
    <div class="bubble">「てすてす」</div>
  </div>

  <p>次に誰と話す？</p>
</div>

  <div class="choice">
    <button onclick="chooseRoute('A')">A：先輩と話す</button>
    <button onclick="chooseRoute('B')">B：幼なじみを探す</button>
    <button onclick="chooseRoute('C')">C：同級生に声をかける</button>
  </div>

  <script>
    checkProgress("story1_A");
    disableBack();

    function chooseRoute(route) {
      addLove("A"); // story1_A に入ったので A の好感度 +1

      const data = loadData();
      data.progress = "story2_" + route;
      saveData(data);

      goTo("story2_" + route);
    }
  </script>

</body>
</html>
