<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沖田ルート①</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="game.css">

  <!-- 共通JS -->
  <script src="game.js"></script>
</head>
<body>

<div class="story-container">

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">沖田君、おはよう</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_okita.png" alt="沖田">
    <div class="bubble">あっ、藤堂さん！　おはようございます</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_okita.png" alt="沖田">
    <div class="bubble">どうです？　制服似合ってるでしょう？</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">うん。よく似合ってる</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_okita.png" alt="沖田">
    <div class="bubble">えへへー、ありがとうございます！</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">その、持ってるのは竹刀？</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_okita.png" alt="沖田">
    <div class="bubble">はい！　剣道部なんです。良かったら放課後一緒に行きましょう！</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">そうだな、サッカー部が休みだったら行くよ</div>
  </div>

  <br>
  <p>……</p>
  <br>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">現代の授業は興味深かったな……。さて、昼休みだ。誰と食べようか</div>
  </div>

</div>

  <div class="choice">
    <button onclick="chooseRoute('B')">土方</button>
    <button onclick="chooseRoute('A')">山南</button>
    <button onclick="chooseRoute('C')">永倉</button>
  </div>

  <script>
    checkProgress("story1_A");
    disableBack();

    function chooseRoute(route) {
      addLove("A"); // story1_A に入ったので A の好感度 +1

      const data = loadData();
      data.progress = "story2_" + route;
      saveData(data);

      goTo("story2_" + route);
    }
  </script>

</body>
</html>
