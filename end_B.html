<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bエンド</title>

  <link rel="stylesheet" href="game.css">
  <script src="game.js"></script>

  <style>
    body { text-align: center; padding-top: 80px; }
  </style>
</head>
<body>

  <h1>Bエンド</h1>

  <p>
    幼なじみは照れくさそうに笑った。  
    「ずっと…君のことが好きだったんだ」  
    その想いが、ようやく重なり合う。  
  </p>

  <button onclick="returnToTitle()">タイトルへ戻る</button>

  <script>
    checkProgress("end_B");
    disableBack();

    const data = loadData();

    data.clear.B = true;

    if (data.clear.A && data.clear.B && data.clear.C && data.clear.normal) {
      data.progress = "secret_end";
    } else {
      data.progress = "end_B";
    }

    saveData(data);
  </script>
