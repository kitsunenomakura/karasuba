<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シークレットエンド</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="game.css">

  <!-- 共通JS -->
  <script src="game.js"></script>
</head>
<body>

<div class="story-container">

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">（あの後ろ姿は……）</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">近藤さん</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_kondo.png" alt="近藤">
    <div class="bubble">平助か。よくやったな。特異点はじきに消滅する</div>
  </div>

  <img class="still" src="img/still_sercret_end.jpg" alt="シークレットエンド">

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">い、いえ……そんな大層なことをしたわけでは……</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_kondo.png" alt="近藤">
    <div class="bubble">平助がいなければ解決できなかった。ただひとつ、残念なのが……</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">？</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_kondo.png" alt="近藤">
    <div class="bubble">私は三国志朗読大会に出ることになり学園をほとんど不在にしていたため、皆と関わる機会がほとんど無かった</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">（三国志朗読大会……？）</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">そういうことでしたら、帰還する前に、最後にみんなでファミレスに行きませんか？　沖田君が行ってみたいと話してて</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_kondo.png" alt="近藤">
    <div class="bubble">それは良いな。早速旗を…</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">わざわざ立てなくても、僕が呼んできますから……！</div>
  </div>

  <br>
  <p>おわり</p>
  <br>

</div>

  <div class="choice">
  <button onclick="returnToTitle()">タイトルへ戻る</button>
  </div>

  <script>
    checkProgress("secret_end");
    disableBack();
  </script>

</body>
</html>
