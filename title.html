<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乙女ゲーム - タイトル</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="game.css">

  <!-- 共通JS -->
  <script src="game.js"></script>

  <style>
    body {
      text-align: right;
      height: 100vh;
      display: flex;
      align-items: flex-end;
    }
    h1 {
      font-size: 40px;
      margin-bottom: 40px;
    }
  </style>
</head>
<body id="title-back">

  <div class="title-menu">
  <img src="img/title_name.png" width="200px" alt="題字">

  <div class="button-container">
  <button id="startBtn" onclick="checkSecret()">スタート</button>
  <button onclick="continueGame()">続きから</button>
  <button id="resetBtn">初期化</button>
  </div>
  <span id="secretMessage" style="color:#b38bff; font-weight:bold;"></span>
  
  </div>

  <script>
    const data = loadData();

    if (data.clear.A && data.clear.B && data.clear.C && data.clear.normal) {
      document.getElementById("secretMessage").textContent =
        "シークレットエンドが解放されました";
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      startNewGame();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("セーブデータを削除しますか？")) {
        localStorage.removeItem("otomeSave");
        alert("セーブデータを初期化しました");
        location.reload();
      }
    });

    // タイトル画面は progress チェック不要
    disableBack();

    function checkSecret() {
      if (data.clear.A && data.clear.B && data.clear.C && data.clear.normal) {
        data.progress = "secret_end";
        saveData(data);
      }

      goTo("ending");
    }

  </script>

</body>
</html>
