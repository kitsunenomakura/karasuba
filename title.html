<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乙女ゲーム - タイトル</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="game.css">

  <!-- 共通JS -->
  <script src="game.js"></script>

  <style>
    body {
      text-align: center;
      padding-top: 80px;
    }
    h1 {
      font-size: 40px;
      margin-bottom: 40px;
    }
  </style>
</head>
<body>

  <h1>乙女ゲーム（仮）</h1>

  <img class="icon" src="img/icon_fujimaru.png" alt="">
  <img class="icon" src="img/icon_todo.png" alt="">
  <img class="icon" src="img/icon_okita.png" alt="">
  <br>
  <img class="icon" src="img/icon_harada.png" alt="">
  <img class="icon" src="img/icon_saito.png" alt="">
  <img class="icon" src="img/icon_yamanami.png" alt="">
  <br>
  <img class="icon" src="img/icon_nagakura.png" alt="">
  <img class="icon" src="img/icon_hijikata.png" alt="">
  <img class="icon" src="img/icon_kondo.png" alt="">

  <button id="startBtn">スタート</button>
  <p id="secretMessage" style="color:#b38bff; font-weight:bold;"></p>
  <br>
  <button onclick="continueGame()">続きから</button>
  <br>
  <button id="resetBtn">セーブデータ初期化</button>

  <script>
    const data = loadData();

    if (data.clear.A && data.clear.B && data.clear.C) {
      document.getElementById("secretMessage").textContent =
        "シークレットエンドが解放されました";
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      startNewGame();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("セーブデータを削除しますか？")) {
        localStorage.removeItem("otomeSave");
        alert("セーブデータを初期化しました");
      }
    });

    // タイトル画面は progress チェック不要
    disableBack();  // 戻る封印（replace方式なので実質何もしない）
  </script>

</body>
</html>
