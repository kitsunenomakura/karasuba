<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cエンド</title>

  <link rel="stylesheet" href="game.css">
  <script src="game.js"></script>

  <style>
    body { text-align: center; padding-top: 80px; }
  </style>
</head>
<body>

  <h1>Cエンド</h1>

  <p>
    同級生はあなたに満面の笑みを向けた。  
    「これからも、いっぱい話そうね！」  
    その笑顔が、何よりも眩しく感じた。  
  </p>

  <button onclick="returnToTitle()">タイトルへ戻る</button>

  <script>
    checkProgress("end_C");
    disableBack();

    const data = loadData();

    data.clear.C = true;

    if (data.clear.A && data.clear.B && data.clear.C && data.clear.normal) {
      data.progress = "secret_end";
    } else {
      data.progress = "end_C";
    }

    saveData(data);
  </script>

</body>
</html>
