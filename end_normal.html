<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノーマルエンド</title>

  <link rel="stylesheet" href="game.css">
  <script src="game.js"></script>

  <style>
    body { text-align: center; padding-top: 80px; }
  </style>
</head>
<body>

  <h1>ノーマルエンド</h1>

  <p>
    学園生活はまだ始まったばかり。  
    これからどんな出会いが待っているのだろう。  
    あなたの物語は、まだ続いていく。  
  </p>

  <button onclick="returnToTitle()">タイトルへ戻る</button>

  <script>
    checkProgress("end_normal");
    disableBack();

    const data = loadData();

    data.clear.normal = true;

    if (data.clear.A && data.clear.B && data.clear.C && data.clear.normal) {
      data.progress = "secret_end";
    } else {
      data.progress = "end_normal";
    }

    saveData(data);
  </script>

</body>
</html>
