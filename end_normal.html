<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノーマルエンド</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="game.css">

  <!-- 共通JS -->
  <script src="game.js"></script>
</head>
<body>

<div class="story-container">
  <div class="line">
    <img class="icon" src="img/icon_okita.png" alt="沖田">
    <div class="bubble">藤堂さん！　聞いてくださいよー、剣道部今日休みだったんです</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_saito.png" alt="斎藤">
    <div class="bubble">それで、みんなでちょっとこの辺りを散策してみようかって話してたんだけど</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_harada.png" alt="原田">
    <div class="bubble">平助も行くよな？</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">はい……是非、ご一緒させてください</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_okita.png" alt="沖田">
    <div class="bubble">私、プリクラ撮りたいです！</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_harada.png" alt="原田">
    <div class="bubble">確か近くにゲーセンありましたよね</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_saito.png" alt="斎藤">
    <div class="bubble">お～いいんじゃない、行ってきなよ</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_okita.png" alt="沖田">
    <div class="bubble">なに他人事みたいに言ってるんですか、全員で撮るんですよ</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_saito.png" alt="斎藤">
    <div class="bubble">いやいやそういうのは若い人達で……</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="藤堂">
    <div class="bubble">同い年じゃないですか。僕らと一緒はそんなに嫌なんですか？</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_harada.png" alt="原田">
    <div class="bubble">いいじゃないすか写真くらい</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_saito.png" alt="斎藤">
    <div class="bubble">あ～も～～わかったよ……</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_okita.png" alt="沖田">
    <div class="bubble">やった！　じゃあ沖田さんがポーズを伝授してさしあげますね</div>
  </div>

  <img class="still" src="img/still_normal_end.jpg" alt="ノーマルエンド">

  <br>
  <p>おわり</p>
  <br>

</div>

  <button onclick="returnToTitle()">タイトルへ戻る</button>

  <script>
    checkProgress("end_normal");
    disableBack();

    const data = loadData();

    data.clear.normal = true;

    if (data.clear.A && data.clear.B && data.clear.C && data.clear.normal) {
      data.progress = "secret_end";
    } else {
      data.progress = "end_normal";
    }

    saveData(data);
  </script>

</body>
</html>
