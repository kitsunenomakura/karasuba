<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オープニング</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="game.css">

  <!-- 共通JS -->
  <script src="game.js"></script>
</head>
<body>

  <h1>オープニング</h1>

<div class="story-container">

  <div class="line">
    <img class="icon" src="img/icon_fujimaru.png" alt="">
    <div class="bubble">かくかくしかじかで藤堂君が乙女ゲっぽい世界で学園生活を楽しめば微小特異点が解決するんだ！</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="">
    <div class="bubble">何故だろう、かくかくしかじかで事情は全て理解した</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="">
    <div class="bubble">サーヴァントって便利だな</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_fujimaru.png" alt="">
    <div class="bubble">違うけどそうだよ！</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="">
    <div class="bubble">？</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_fujimaru.png" alt="">
    <div class="bubble">近藤さん、土方さん、山南さんは教員、永倉さんは用務員、はじめちゃん、沖田さん、原田さんは生徒として既に学園にいるよ</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="">
    <div class="bubble">分かった</div>
  </div>

  <div class="line">
    <img class="icon" src="img/icon_fujimaru.png" alt="">
    <div class="bubble">それじゃあよろしく！</div>
  </div>

  <br>

  <div class="line">
    <img class="icon" src="img/icon_todo.png" alt="">
    <div class="bubble">さて、登校しようか。あれ、あそこにいるのは……</div>
  </div>

</div>

  <div class="choice">
    <button onclick="goStory1('A')">A：クールな先輩</button>
    <button onclick="goStory1('B')">B：幼なじみ</button>
    <button onclick="goStory1('C')">C：同級生</button>
  </div>

  <script>
    // 正しい進行位置かチェック
    checkProgress("opening");

    // 戻るボタン封印（replace方式なので実質何もしない）
    disableBack();

    // story1 へ進む処理
    function goStory1(route) {
      const data = loadData();
      data.progress = "story1_" + route;
      saveData(data);

      goTo("story1_" + route);
    }
  </script>

</body>
</html>
